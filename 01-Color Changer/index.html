<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="decoration star star-one">✧</div>
        <div class="decoration star star-two">✧</div>
        <div class="decoration star star-three">✦</div>

        <div class="sticker sticker-one">Have fun!</div>
        <div class="sticker sticker-two">♡</div>

        <section class="window">

            <div class="window-header">
                <div class="window-controls">
                    <span class="control pink"></span>
                    <span class="control yellow"></span>
                    <span class="control purple"></span>
                </div>

                <div class="window-title">COLOR STUDIO</div>
            </div>

            <div class="window-content">

                <h1>Color Changer</h1>

                <p>
                    Click the button to change the background colour!
                </p>

                <button id="colorBtn">
                    CHANGE COLOR
                </button>

                <div class="footer">
                    A LITTLE EXPERIMENT IN COLORS
                </div>

            </div>

        </section>

        <div class="decoration cat">♡</div>
        <div class="decoration sparkle">✧</div>

    </main>
<script src="script.js"></script>
</body>
</html>
