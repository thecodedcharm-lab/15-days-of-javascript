
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Switch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="room" id="room">

        <div class="wire"></div>

        <div class="lamp">
            <div class="lamp-shade"></div>
        </div>

        <div class="light-beam"></div>

        <div class="message">
            <h2 id="message">Shine bright!</h2>
            <p id="status">The light is ON</p>
        </div>

        <button class="switch" id="switchButton">
            <span class="switch-dot"></span>
        </button>
        <p class="footer">Made with light ✨</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
