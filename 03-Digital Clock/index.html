<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="clock-container">
        <p class="greeting">A LITTLE MOMENT IN TIME ✦</p>

        <div class="clock">
            <div class="time-group">
                <div class="flip-card"><span class="digit">09</span></div>
                <div class="flip-card"><span class="digit">27</span></div>
                <div class="flip-card"><span class="digit">15</span></div>
            </div>
            <span class="period">AM</span>
        </div>

        <div class="date-section">
            <span>THURSDAY</span>
            <span class="separator">✦</span>
            <span>NOVEMBER 27, 2026</span>
        </div>

        <p class="footer">Make today a beautiful one ♡</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
