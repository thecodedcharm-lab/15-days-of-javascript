<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <nav class="navbar">
            <span class="cookie">🍪</span>
            <h1>Counter Plus</h1>
            <button class="reset">↻</button>
        </nav>

        <div class="counter-card">

            <div class="label">Current Count</div>

            <div class="count">0</div>

        </div>

        <div class="buttons">

            <button class="action decrease">
                <span>−</span>
                Decrease
            </button>

            <button class="action increase">
                <span>+</span>
                Increase
            </button>

        </div>

        <div class="reload-area">
            <button class="reload">
                ↻ &nbsp; Reload
            </button>
        </div>

    </div>
<script src="script.js"></script>

</body>
</html>
